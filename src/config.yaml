
# ==========================================
# SCHLIEREN EXPERIMENT CONFIGURATION
# ==========================================

# --- Output settings ---

output:
  analysis_dir: output/analysis


# --- Image settings ---

images:

  # Reference image (heater OFF)
  reference: "../images/d4/heated/DSC05262.JPG"

  # Approximate JPEG gamma correction
  jpg_gamma: 2.2

  # Heated images
  heated:
    - label: lighter
      file: "../images/d4/heated/DSC05263.JPG"
      heater_reference_C: 56


# --- Knife-edge calibration ---

calibration:

  # Saved calibration data
  results_file: output/calibration/calibration.npz

  # ROI coordinates in original image pixels
  roi:
    x: 1817
    y: 276
    width: 2629
    height: 476

  # Reference blade position (mm)
  reference_blade_mm: 127.18

  # Pixel calibration quality settings
  minimum_intensity_span: 0.001
  max_relative_fit_error: 0.05

  # Calibration photographs (heater OFF)
  frames:
    - blade_mm: 125.54
      file: "../images/d4/calibrate/DSC05253.JPG"

    - blade_mm: 127.01
      file: "../images/d4/calibrate/DSC05255.JPG"

    - blade_mm: 127.73
      file: "../images/d4/calibrate/DSC05257.JPG"

    - blade_mm: 127.81
      file: "../images/d4/calibrate/DSC05258.JPG"

    - blade_mm: 128.36
      file: "../images/d4/calibrate/DSC05259.JPG"

    - blade_mm: 127.14
      file: "../images/d4/calibrate/DSC05260.JPG"

    - blade_mm: 127.26
      file: "../images/d4/calibrate/DSC05261.JPG"

    - blade_mm: 127.18
      file: "../images/d4/heated/DSC05262.JPG"





# --- Optical geometry ---

geometry:

  # Effective focal length (m)
  f_eff_m: 0.46

  # Effective depth of heated air along optical path (m)
  optical_depth_m: 0.033

  # Object-plane physical scale per original pixel (m/px)
  # meters_per_pixel: 0.0002
  meters_per_pixel: 0.00008

  # Optical deflection orientation
  angle_sign: -1


# --- Physical constants ---

physics:

  pressure_pa: 101325
  ambient_temp_C: 22
  K_m3_per_kg: 0.000225
  R_air_j_per_kgK: 287.05


# --- Analysis settings ---

analysis:

  # Gaussian smoothing
  smooth_sigma_px: 1.0

  # Top rows assumed to contain ambient air
  ref_top_rows: 4

  # Minimum absolute usable calibration slope
  min_abs_slope_per_mm: 1.0e-10

  # Ignore the calibration validity mask for visualization
  use_calibration_mask: false

  # Still reject zero or extremely small slopes
  min_abs_slope_per_mm: 0.0001

  min_reference_intensity: 0.002

  ambient_row: 450