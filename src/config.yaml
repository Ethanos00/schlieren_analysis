
output_dir: output
images:
  #reference should be at same height as heated images
  reference: ../../knife_cal_imag/day_2/DSC05217.jpg
  #setting to 2.2 for jpg workaround
  jpg_gamma: 2.2
  # For ordinary JPEGs, set approx_gamma: 2.2 only as a rough workaround.
  # Omit for genuinely linear images. RAW -> linear TIFF preferred.

  heated:
    - {label: lighter, file: ../../knife_cal_imag/day_2/with flame/DSC05219.JPG, heater_reference_C: 40}

calibration:

  # Region of interest in ORIGINAL image pixels
  roi:
    x: 2000
    y: 1000
    width: 1500
    height: 1200


  reference_blade_um: -15
  minimum_intensity_span: 0.001
  # Capture EVERY calibration image with heater OFF and same camera settings.
  frames:
    - blade_mm: -865
      file: "../images/d2/DSC05214.jpg"

    - blade_mm: -500
      file: "../images/d2/DSC05215.jpg"

    - blade_mm: -400
      file: "../images/d2/DSC05216.jpg"
